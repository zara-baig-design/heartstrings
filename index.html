<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Heartstrings</title>
  <link rel="preload" href="fonts/GT-America-Standard-Light-Trial.otf" as="font" crossorigin>
  <link rel="stylesheet" href="style.css?v=1794564470">
  <script type="importmap">{ "imports": { "three": "./vendor/three.min.js" } }</script>
  <link rel="modulepreload" href="vendor/three.min.js">
</head>
<body data-layout="dock" class="on-front">
  <!-- Icon set: hairline astronomy marks, drawn in the text color. Use with <svg class="i"><use href="#i-name"/></svg>. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-affinity" viewBox="0 0 16 16"><circle cx="8" cy="8" r="1.4" fill="currentColor" stroke="none"/><circle cx="8" cy="8" r="4"/><circle cx="8" cy="8" r="6.8"/></symbol>
      <symbol id="i-cadence" viewBox="0 0 16 16"><ellipse cx="8" cy="8" rx="6.8" ry="3.6" transform="rotate(-20 8 8)"/><circle cx="8" cy="8" r="1.4" fill="currentColor" stroke="none"/><circle cx="13.6" cy="5.2" r="1.3" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-expanse" viewBox="0 0 16 16"><circle cx="3" cy="12" r="1.4" fill="currentColor" stroke="none"/><path d="M4.6 10.6 10.6 4.6" stroke-dasharray="1.2 1.6"/><path d="M12.5 1.5v4M10.5 3.5h4"/></symbol>
      <symbol id="i-then" viewBox="0 0 16 16"><path d="M10.5 2.2a6 6 0 1 0 0 11.6 4.8 4.8 0 1 1 0-11.6z"/></symbol>
      <symbol id="i-sphere" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.6"/><ellipse cx="8" cy="8" rx="2.8" ry="6.6"/><path d="M1.4 8h13.2"/></symbol>
      <symbol id="i-chart" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.6"/><circle cx="8" cy="8" r="3.4" stroke-dasharray="1 1.4"/><path d="M8 .6v14.8M.6 8h14.8"/></symbol>
      <symbol id="i-zstar" viewBox="186 -6 186 244"><polygon points="278.94 142.38 246.35 232.27 243.43 129.95 195.86 102.7 240.23 81.27 233.89 0 279.77 78.02 356.7 62.49 308.15 118.88 361.9 226.19" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-play" viewBox="0 0 16 16"><path d="M5 3.5v9l7.5-4.5z"/></symbol>
      <symbol id="i-pause" viewBox="0 0 16 16"><path d="M5.5 3.5v9M10.5 3.5v9"/></symbol>
      <filter id="watercolor" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="3" seed="4"/><feDisplacementMap in="SourceGraphic" scale="46" xChannelSelector="R" yChannelSelector="G"/></filter>
      <symbol id="i-plan" viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12"/><path d="M2 6h12M6 2v12" stroke-dasharray="1 1.4"/></symbol>
    </defs>
  </svg>

  <div id="paper" aria-hidden="true"></div>

  <!-- the front page -->
  <section id="front" role="button" tabindex="0" aria-label="Heartstrings. Tap to enter.">
    <div class="front-title"><h1>Heartstrings</h1><p class="front-cta"><span class="on-touch">Tap to enter</span><span class="on-mouse">Click to enter</span></p></div>
  </section>
  <div id="graph">
  </div>

  <header id="top">
    <div class="plate">
      <h1 id="title"><svg class="i mark"><use href="#i-zstar"/></svg>Heartstrings</h1>
    </div>
  </header>

  <nav id="dock" aria-label="Explore">
    <div class="seg modes" role="group" aria-label="Arrange by">
      <button data-mode="closeness" title="Arranged by closeness"><svg class="i"><use href="#i-affinity"/></svg>Closeness</button>
      <button data-mode="frequency" title="Arranged by how often we talk"><svg class="i"><use href="#i-cadence"/></svg>Frequency</button>
      <button data-mode="geography" title="Arranged by how far away they live"><svg class="i"><use href="#i-expanse"/></svg>Distance</button>
      <button data-mode="room" title="Where everyone hangs in the gallery"><svg class="i"><use href="#i-plan"/></svg>Room</button>
    </div>
    <div class="time">
      <button id="play" aria-label="Play through the years"><svg class="i"><use href="#i-play"/></svg></button>
      <input id="years" type="range" min="0" max="0" step="1" value="0" aria-label="Year met">
      <span id="year-label">now</span>
    </div>
    <div class="seg era" role="group" aria-label="When">
      <button data-era="then" title="How close we were at our closest"><svg class="i"><use href="#i-then"/></svg>Then</button>
      <button data-era="now" class="active"><svg class="i"><use href="#i-zstar"/></svg>Now</button>
    </div>
    <div class="seg view" role="group" aria-label="View">
      <button data-view="3d" class="active"><svg class="i"><use href="#i-sphere"/></svg>3D</button>
      <button data-view="map" title="Flat, seen from above"><svg class="i"><use href="#i-chart"/></svg>Map</button>
    </div>
    <div class="seg more" role="group" aria-label="More">
      <button id="key-btn" aria-expanded="false"><svg class="i"><use href="#i-zstar"/></svg>Key</button>
      <button id="deck-btn"><svg class="i"><use href="#i-plan"/></svg>Cards</button>
    </div>
  </nav>

  <aside id="key" hidden>
    <p class="label">Group</p>
    <div id="group-legend" class="chips"></div>
    <p class="label">Status</p>
    <div id="status-legend" class="rows"></div>
  </aside>

  <aside id="panel" hidden>
    <button class="close" aria-label="Close">×</button>
    <button class="back" hidden>← Return</button>
    <div id="panel-body"></div>
  </aside>

  <section id="deck" hidden aria-label="Everyone's cards">
    <button class="close" aria-label="Close">×</button>
    <div class="deck-track"></div>
    <div class="deck-nav">
      <button class="deck-prev" aria-label="Previous">←</button>
      <span class="deck-count"></span>
      <button class="deck-next" aria-label="Next">→</button>
    </div>
  </section>

  <aside id="qr" aria-label="Open on your phone"><img src="qr.svg" alt="QR code for this site" width="84" height="84"><p>Open on<br>your phone</p></aside>

  <div id="message" hidden></div>

  <script type="module" src="app.js?v=1794564470"></script>
</body>
</html>
